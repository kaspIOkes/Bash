<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <title>Czytak — czytanie ze słuchu z podświetlaniem słów</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Czytak</h1>

  <textarea id="source" rows="6" placeholder="Wklej tekst źródłowy (np. po niemiecku)..."></textarea>
  <textarea id="translation" rows="6" placeholder="Wklej tłumaczenie, jedno zdanie na linię, w tej samej kolejności co zdania źródłowe (opcjonalne)..."></textarea>

  <div class="controls">
    <label>
      Lektor
      <select id="voice"></select>
    </label>
    <label>
      Szybkość (<span id="rate-value">1.0</span>x)
      <input id="rate" type="range" min="0.5" max="2" step="0.05" value="1" />
    </label>
    <button id="play">Czytaj</button>
    <span id="status"></span>
  </div>

  <div id="reading"></div>

  <audio id="audio"></audio>

  <script src="app.js"></script>
</body>
</html>
